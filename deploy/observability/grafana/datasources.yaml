# Grafana datasource provisioning: Tempo (traces) + Loki (logs), cross-linked so
# you can pivot trace ⇄ logs by trace_id — the whole point of Tier 2.
apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a span, jump to its logs in Loki filtered by this request's trace_id.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: false
        customQuery: true
        query: '{job="devintel"} | json | trace_id=`${__trace.traceId}`'

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # From a log line, jump to its trace in Tempo (the "TraceID" link).
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          url: '${__value.raw}'
          datasourceUid: tempo
