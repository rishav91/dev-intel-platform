# Phase 0 local stack — the walking-skeleton dependencies.
# Brings up: Redpanda (Kafka API), Citus/Postgres, Redis, SeaweedFS (S3 API).
# Keycloak/OIDC is deferred to Phase 2 (BFF); Phase 0 secures the spine via
# GitHub webhook HMAC + tenant resolution + Postgres RLS.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
services:
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Citus image = Postgres 16 + citus extension. Phase 0 runs single-node
  # (no distribution yet); sharding is wired in Phase 2. RLS works identically.
  postgres:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_USER: devintel
      POSTGRES_PASSWORD: devintel
      POSTGRES_DB: devintel
    ports:
      - "5432:5432"
    volumes:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devintel -d devintel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SeaweedFS replaces MinIO as the local S3-compatible object store: MinIO's
  # community edition was archived (read-only, unmaintained) in early 2026.
  # `server -s3` runs master+volume+filer+s3 in one process; app code talks the
  # S3 API unchanged. S3 API on :8333, filer browser UI on :8888.
  # Endpoint http://localhost:8333  accessKey devintel  secretKey devintel12345
  seaweedfs:
    image: chrislusf/seaweedfs:4.33
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3config.json
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
    volumes:
      - ./seaweedfs/s3config.json:/etc/seaweedfs/s3config.json:ro
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer browser UI
    # S3 port has no reliable health route (paths parse as bucket names), so we
    # probe the master status endpoint — same process, up within ~1s of S3.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9333/cluster/status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Observability (Tier 2): end-to-end traces + correlated logs ----------
  # The host-run Go services (make run-*) export OTLP spans to Tempo on :4318 and
  # tee their JSON logs to ./logs, which Promtail tails into Loki. Grafana stitches
  # both: a trace's waterfall, and per-span links to that request's log lines.
  # Open Grafana at http://localhost:3000 (anonymous admin). See docs/OBSERVABILITY.md.
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo query API (Grafana → Tempo)
      - "4318:4318"   # OTLP/HTTP — services export traces here
      - "4317:4317"   # OTLP/gRPC
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3200/ready >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Host log dir the run-* targets tee into (created by the Makefile).
      - ../logs:/var/log/devintel:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - loki

# Note: migrations are auto-applied by the citus image ONLY on first boot of a
# fresh volume (via /docker-entrypoint-initdb.d). To apply migrations added later
# to an already-running DB, use `make migrate` (tracked + idempotent) — no need to
# wipe. A full reset is still `make down` (down -v) then `make up`.
