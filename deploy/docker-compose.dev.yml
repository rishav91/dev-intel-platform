# Phase 0 local stack — the walking-skeleton dependencies.
# Brings up: Redpanda (Kafka API), Citus/Postgres, Redis, MinIO.
# Keycloak/OIDC is deferred to Phase 2 (BFF); Phase 0 secures the spine via
# GitHub webhook HMAC + tenant resolution + Postgres RLS.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
services:
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Citus image = Postgres 16 + citus extension. Phase 0 runs single-node
  # (no distribution yet); sharding is wired in Phase 2. RLS works identically.
  postgres:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_USER: devintel
      POSTGRES_PASSWORD: devintel
      POSTGRES_DB: devintel
    ports:
      - "5432:5432"
    volumes:
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devintel -d devintel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

# Note: migrations are auto-applied by the citus image on first boot via
# /docker-entrypoint-initdb.d. To re-apply after changes: `docker compose down -v` then up.
