name: ci
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devintel
          POSTGRES_PASSWORD: devintel
          POSTGRES_DB: devintel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devintel -d devintel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DSN: postgres://devintel:devintel@localhost:5432/devintel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }

      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

      - name: Apply migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -f "$f"
          done

      # Red-team isolation gate: tenant RLS must hold. A failure blocks merge.
      - name: Tenant isolation (red-team)
        run: go test ./tests/red-team/... -run TestTenantIsolation -v

      - name: Unit tests
        run: go test ./...
